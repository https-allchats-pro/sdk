name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (base + dev)
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Smoke-import wheel
        run: |
          python -m venv /tmp/acs-ci-smoke
          /tmp/acs-ci-smoke/bin/pip install dist/*.whl
          /tmp/acs-ci-smoke/bin/python -c "from allchats_sdk import __version__, Message; from allchats_sdk.telegram import TelegramClient; print(__version__, Message(id='1', chat_id='c').id, TelegramClient.provider_id)"
