[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allchats-sdk"
version = "0.1.1"
description = "Messenger integrations SDK (Telegram, VK, MAX, Avito, Discord, WhatsApp)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "messager.shop", email = "sojiguy@mail.ru" },
]
keywords = [
  "messenger",
  "telegram",
  "vk",
  "max",
  "whatsapp",
  "discord",
  "avito",
  "sdk",
  "telethon",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/https-allchats-pro/sdk"
Repository = "https://github.com/https-allchats-pro/sdk"
Issues = "https://github.com/https-allchats-pro/sdk/issues"
Documentation = "https://github.com/https-allchats-pro/sdk/tree/main/docs"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2",
  "twine>=5.0",
]
telegram = [
  "telethon>=1.36.0",
  "ntgcalls>=3.0.0b4",
  "python-socks[asyncio]>=2.4.0",
  "PySocks>=1.7.1",
]
vk = [
  "vk-api>=11.9.9",
  "requests>=2.31.0",
]
max = [
  "maxapi-python>=2.0.0",
]
whatsapp = [
  "neonize>=0.4.1.post0",
  "protobuf>=7.34.1,<8",
]
discord = [
  "discord.py-self>=2.1.0",
  "aiohttp>=3.9.0",
  "websockets>=13.0",
  "cryptography>=43.0.0",
  "PyNaCl>=1.5.0",
  "opuslib>=3.0.1",
  "davey>=0.1.6",
  "curl_cffi>=0.7.0",
  "qrcode>=7.4.2",
]
avito = [
  "requests>=2.31.0",
]
all = [
  "allchats-sdk[telegram,vk,max,whatsapp,discord,avito]",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests", "Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
allchats_sdk = ["py.typed"]
